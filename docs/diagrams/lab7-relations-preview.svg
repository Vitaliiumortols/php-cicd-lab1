<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">iPhoneHub зв'язки моделей Eloquent</title>
  <desc id="desc">Схема дев'яти моделей із кратностями зв'язків, композиціями та проміжною таблицею product tag.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172b4d" flood-opacity="0.12"/></filter>
    <marker id="diamond" markerWidth="16" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M1 6 L6 1 L11 6 L6 11Z" fill="#37835b"/></marker>
    <style>
      .title{font:700 28px Inter,Arial,sans-serif;fill:#172b4d}.sub{font:400 16px Inter,Arial,sans-serif;fill:#52667a}
      .h{font:700 17px Inter,Arial,sans-serif;fill:#172b4d}.t{font:400 13px Inter,Arial,sans-serif;fill:#52667a}.card{stroke-width:2}
      .edge{fill:none;stroke:#64788c;stroke-width:2}.label{font:700 12px Inter,Arial,sans-serif;fill:#43576a;paint-order:stroke;stroke:#f8fafc;stroke-width:5px}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#f8fafc"/>
  <text x="55" y="55" class="title">iPhoneHub — зв'язки Eloquent та кратності</text>
  <text x="55" y="84" class="sub">Фактична модель лабораторних робіт №6–7</text>

  <g class="edge">
    <path d="M280 300 V390"/><path d="M440 225 H585"/><path d="M280 535 V675" marker-start="url(#diamond)"/>
    <path d="M780 315 V470" marker-start="url(#diamond)"/><path d="M965 235 H1120 V765 H965"/>
    <path d="M965 550 H1120"/><path d="M455 755 H1120"/><path d="M1285 300 V470"/>
    <path d="M1285 650 V790 H1355"/><path d="M1480 835 H1515 V915 H1435"/>
  </g>
  <g class="label">
    <text x="292" y="345">1 — 0..1</text><text x="495" y="214">1 — 0..*</text><text x="292" y="615">1 — 0..*</text>
    <text x="792" y="405">1 — 1..*</text><text x="1075" y="455">1 — 0..1</text><text x="1025" y="540">0..1 — 0..*</text>
    <text x="800" y="744">1 — 0..*</text><text x="1298" y="395">0..1 — 0..*</text><text x="1300" y="810">0..*</text><text x="1490" y="900">0..*</text>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(105 155)"><rect class="card" width="350" height="145" rx="14" fill="#e8f0fe" stroke="#4a6fa5"/><text x="22" y="34" class="h">User</text><text x="22" y="62" class="t"><tspan x="22">id · name · email · role · active</tspan><tspan x="22" dy="24">cart(): HasOne</tspan><tspan x="22" dy="22">orders(): HasMany</tspan></text></g>
    <g transform="translate(105 390)"><rect class="card" width="350" height="145" rx="14" fill="#eaf7f0" stroke="#37835b"/><text x="22" y="34" class="h">Cart</text><text x="22" y="62" class="t"><tspan x="22">id · user_id · status</tspan><tspan x="22" dy="24">user(): BelongsTo</tspan><tspan x="22" dy="22">items(): HasMany</tspan></text></g>
    <g transform="translate(105 675)"><rect class="card" width="350" height="160" rx="14" fill="#f3fbf6" stroke="#72ad8d"/><text x="22" y="34" class="h">CartItem</text><text x="22" y="62" class="t"><tspan x="22">cart_id · product_id · quantity</tspan><tspan x="22" dy="25">cart(): BelongsTo</tspan><tspan x="22" dy="22">product(): BelongsTo</tspan></text></g>

    <g transform="translate(585 155)"><rect class="card" width="380" height="160" rx="14" fill="#fff4d6" stroke="#c99820"/><text x="22" y="34" class="h">Order</text><text x="22" y="62" class="t"><tspan x="22">user_id · status · total_kop · checkout_key</tspan><tspan x="22" dy="25">user(): BelongsTo · items(): HasMany</tspan><tspan x="22" dy="22">shipment(): HasOne</tspan></text></g>
    <g transform="translate(585 470)"><rect class="card" width="380" height="175" rx="14" fill="#fff9ea" stroke="#d7b34f"/><text x="22" y="34" class="h">OrderItem</text><text x="22" y="62" class="t"><tspan x="22">order_id · product_id? · product_name</tspan><tspan x="22" dy="22">sku · quantity · unit_price_kop</tspan><tspan x="22" dy="27">order(): BelongsTo</tspan><tspan x="22" dy="22">product(): BelongsTo</tspan></text></g>
    <g transform="translate(585 760)"><rect class="card" width="380" height="165" rx="14" fill="#fff1f0" stroke="#c85c5a"/><text x="22" y="34" class="h">Shipment</text><text x="22" y="62" class="t"><tspan x="22">order_id · tracking_number · status</tspan><tspan x="22" dy="22">recipient · address · delivered_at</tspan><tspan x="22" dy="27">order(): BelongsTo</tspan></text></g>

    <g transform="translate(1120 470)"><rect class="card" width="400" height="180" rx="14" fill="#eaf4fb" stroke="#3e7498"/><text x="22" y="34" class="h">Product</text><text x="22" y="62" class="t"><tspan x="22">category_id? · model_name · sku · price_kop</tspan><tspan x="22" dy="22">stock_qty · reserved_qty · active</tspan><tspan x="22" dy="27">category() · tags() · cartItems() · orderItems()</tspan><tspan x="22" dy="22">availableQty(): int</tspan></text></g>
    <g transform="translate(1120 155)"><rect class="card" width="400" height="145" rx="14" fill="#f0ecff" stroke="#7657b5"/><text x="22" y="34" class="h">Category</text><text x="22" y="62" class="t"><tspan x="22">id · name · slug · active</tspan><tspan x="22" dy="27">products(): HasMany</tspan></text></g>
    <g transform="translate(1165 790)"><rect width="270" height="90" rx="12" fill="#faf8ff" stroke="#a695cf" stroke-dasharray="7 5"/><text x="20" y="34" class="h">product_tag</text><text x="20" y="62" class="t">UNIQUE(product_id, tag_id)</text></g>
    <g transform="translate(1165 915)"><rect class="card" width="270" height="125" rx="14" fill="#f0ecff" stroke="#7657b5"/><text x="22" y="34" class="h">Tag</text><text x="22" y="62" class="t"><tspan x="22">id · name · slug</tspan><tspan x="22" dy="27">products(): BelongsToMany</tspan></text></g>
  </g>

  <g>
    <rect x="90" y="930" width="410" height="105" rx="12" fill="#fff" stroke="#9aa9b8"/>
    <text x="110" y="958" class="h">Композиція</text><text x="110" y="984" class="t"><tspan x="110">CartItem видаляється разом із Cart;</tspan><tspan x="110" dy="21">OrderItem — разом із Order.</tspan></text>
    <rect x="525" y="950" width="510" height="85" rx="12" fill="#fff" stroke="#9aa9b8"/>
    <text x="545" y="978" class="h">Історичний знімок OrderItem</text><text x="545" y="1004" class="t"><tspan x="545">Назва, SKU та ціна не змінюються після продажу.</tspan></text>
  </g>
</svg>
