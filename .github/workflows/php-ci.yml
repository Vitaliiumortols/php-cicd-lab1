name: PHP CI Application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Lint code with Pint
        run: ./vendor/bin/pint --test

      - name: Run application tests
        run: php artisan test

      - name: Demonstrate GitHub Secrets
        env:
          MY_SUPER_SECRET_KEY: ${{ secrets.MY_SUPER_SECRET_KEY }}
        run: echo "Secret value is $MY_SUPER_SECRET_KEY"
